[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clockvec"
version = "0.0.1"
description = "Conformance vectors for epigenetic clock implementations"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/clockvec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
